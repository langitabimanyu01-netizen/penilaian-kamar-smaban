<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asramaku - Penilaian Kebersihan Kamar SMA Banua</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-lg sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-hotel text-indigo-400 text-2xl"></i>
        <h1 class="text-xl font-bold tracking-wide">ASRAMAKU <span class="text-xs text-indigo-400 font-normal">SMA Banua</span></h1>
      </div>
      <div id="statusSync" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse" id="statusDot"></span>
        <span id="statusText">Menghubungkan ke Cloud...</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6 space-y-6">

    <!-- Form Input Penilaian -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
      <h2 class="text-lg font-semibold mb-4 text-indigo-300 flex items-center gap-2">
        <i class="fa-solid fa-pen-to-square"></i> Form Penilaian Kebersihan Kamar
      </h2>

      <form id="formPenilaian" onsubmit="handleSimpan(event)" class="space-y-4">
        <!-- Informasi Dasar -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Tahun</label>
            <input type="number" id="tahun" value="2026" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Bulan</label>
            <select id="bulan" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
              <option value="Januari">Januari</option>
              <option value="Februari">Februari</option>
              <option value="Maret">Maret</option>
              <option value="April">April</option>
              <option value="Mei" selected>Mei</option>
              <option value="Juni">Juni</option>
              <option value="Juli">Juli</option>
              <option value="Agustus">Agustus</option>
              <option value="September">September</option>
              <option value="Oktober">Oktober</option>
              <option value="November">November</option>
              <option value="Desember">Desember</option>
            </select>
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Minggu Ke-</label>
            <input type="number" id="minggu" min="1" max="5" value="1" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Tanggal</label>
            <input type="date" id="tanggal" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div class="col-span-2 md:col-span-1">
            <label class="text-xs text-slate-400 block mb-1">Nomor Kamar</label>
            <input type="text" id="kamar" placeholder="Contoh: 101" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
        </div>

        <hr class="border-slate-700 my-2">

        <!-- Assessment Scores -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
          <div>
            <label class="text-xs text-slate-400 block mb-1">Kasur (0-100)</label>
            <input type="number" id="kasur" min="0" max="100" placeholder="90" oninput="hitungTotal()" required class="score-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Toilet (0-100)</label>
            <input type="number" id="toilet" min="0" max="100" placeholder="85" oninput="hitungTotal()" required class="score-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Lantai (0-100)</label>
            <input type="number" id="lantai" min="0" max="100" placeholder="90" oninput="hitungTotal()" required class="score-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Udara (0-100)</label>
            <input type="number" id="udara" min="0" max="100" placeholder="88" oninput="hitungTotal()" required class="score-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
          <div>
            <label class="text-xs text-slate-400 block mb-1">Tata Letak (0-100)</label>
            <input type="number" id="tataLetak" min="0" max="100" placeholder="92" oninput="hitungTotal()" required class="score-input w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm focus:border-indigo-500 outline-none">
          </div>
        </div>

        <!-- Submit Bar -->
        <div class="flex flex-col md:flex-row justify-between items-center bg-slate-900 p-4 rounded-lg border border-slate-700 gap-4 mt-4">
          <div class="text-sm">
            Rata-Rata Skor: <span id="totalScoreText" class="text-xl font-bold text-indigo-400">0</span> / 100
          </div>
          <button type="submit" id="btnSimpan" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-6 py-2 rounded-lg transition-all flex items-center justify-center gap-2">
            <i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Cloud
          </button>
        </div>
      </form>
    </div>

    <!-- Data Table Real-Time -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl overflow-x-auto">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-semibold text-indigo-300 flex items-center gap-2">
          <i class="fa-solid fa-table"></i> Rekap Nilai dari Cloud (Google Sheets)
        </h2>
        <button onclick="loadDataFromCloud()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-slate-200 transition-all flex items-center gap-1">
          <i class="fa-solid fa-rotate"></i> Refresh Data
        </button>
      </div>

      <table class="w-full text-left border-collapse text-xs md:text-sm">
        <thead>
          <tr class="bg-slate-900 text-slate-400 border-b border-slate-700">
            <th class="p-2">Tgl / Bln / Thn</th>
            <th class="p-2">Mmg</th>
            <th class="p-2">Kamar</th>
            <th class="p-2">Kasur</th>
            <th class="p-2">Toilet</th>
            <th class="p-2">Lantai</th>
            <th class="p-2">Udara</th>
            <th class="p-2">Tata Letak</th>
            <th class="p-2 text-right">Rata-Rata</th>
          </tr>
        </thead>
        <tbody id="tableBody" class="divide-y divide-slate-700 text-slate-300">
          <tr>
            <td colspan="9" class="p-4 text-center text-slate-500">Memuat data dari Google Sheets...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script>
    // =========================================================================
    // TEMPEL URL WEB APP APPS SCRIPT KAMU DI DALAM TANDA PETIK DI BAWAL INI:
    // =========================================================================
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-89ESvnJhZ1i6jV4O_QrkGCGjpXYAoiPfBFNCjiMoCpRfcl7RQOlG8sF1Jy9psraYlw/exec";

    // Set tanggal default hari ini
    document.getElementById('tanggal').valueAsDate = new Date();

    function hitungTotal() {
      const kasur = parseFloat(document.getElementById('kasur').value) || 0;
      const toilet = parseFloat(document.getElementById('toilet').value) || 0;
      const lantai = parseFloat(document.getElementById('lantai').value) || 0;
      const udara = parseFloat(document.getElementById('udara').value) || 0;
      const tataLetak = parseFloat(document.getElementById('tataLetak').value) || 0;

      const total = (kasur + toilet + lantai + udara + tataLetak) / 5;
      document.getElementById('totalScoreText').innerText = total.toFixed(1);
      return total.toFixed(1);
    }

    // 1. FUNGSI UNTUK MENARIK DATA DARI GOOGLE SHEETS (REAL-TIME GET)
    function loadDataFromCloud() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      const tableBody = document.getElementById('tableBody');

      if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes("PASTE_URL")) {
        statusDot.className = "w-2 h-2 rounded-full bg-red-500";
        statusText.innerText = "URL Apps Script Belum Diisi!";
        tableBody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-red-400">Silakan masukkan URL Apps Script di file HTML kamu terlebih dahulu.</td></tr>`;
        return;
      }

      statusDot.className = "w-2 h-2 rounded-full bg-yellow-400 animate-pulse";
      statusText.innerText = "Mengambil data terbaru...";

      fetch(APPS_SCRIPT_URL)
        .then(res => res.json())
        .then(result => {
          if (result.status === "success" && result.data) {
            statusDot.className = "w-2 h-2 rounded-full bg-green-500";
            statusText.innerText = "Tersinkronisasi dengan Cloud";
            renderTable(result.data);
          } else {
            throw new Error(result.message || "Gagal memuat data");
          }
        })
        .catch(err => {
          console.error("Fetch Error:", err);
          statusDot.className = "w-2 h-2 rounded-full bg-red-500";
          statusText.innerText = "Gagal Terhubung ke Cloud";
          tableBody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-red-400">Gagal menarik data dari Google Sheets. Cek koneksi atau URL Apps Script.</td></tr>`;
        });
    }

    function renderTable(rows) {
      const tableBody = document.getElementById('tableBody');
      tableBody.innerHTML = '';

      if (rows.length <= 1) {
        tableBody.innerHTML = `<tr><td colspan="9" class="p-4 text-center text-slate-500">Belum ada data penilaian tersimpan.</td></tr>`;
        return;
      }

      // Baris index 0 adalah Header, tampilkan dari baris index 1
      for (let i = rows.length - 1; i >= 1; i--) {
        const r = rows[i];
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-750 transition-colors";
        tr.innerHTML = `
          <td class="p-2">${r[3] || ''} <span class="text-slate-500">(${r[1] || ''})</span></td>
          <td class="p-2">${r[2] || ''}</td>
          <td class="p-2 font-bold text-indigo-400">${r[4] || ''}</td>
          <td class="p-2">${r[5] || 0}</td>
          <td class="p-2">${r[6] || 0}</td>
          <td class="p-2">${r[7] || 0}</td>
          <td class="p-2">${r[8] || 0}</td>
          <td class="p-2">${r[9] || 0}</td>
          <td class="p-2 text-right font-bold text-green-400">${r[10] || 0}</td>
        `;
        tableBody.appendChild(tr);
      }
    }

    // 2. FUNGSI UNTUK MENYIMPAN DATA KE GOOGLE SHEETS (POST)
    function handleSimpan(e) {
      e.preventDefault();
      const btn = document.getElementById('btnSimpan');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Menyimpan...`;

      const payload = {
        tahun: document.getElementById('tahun').value,
        bulan: document.getElementById('bulan').value,
        minggu: document.getElementById('minggu').value,
        tanggal: document.getElementById('tanggal').value,
        kamar: document.getElementById('kamar').value,
        kasur: parseFloat(document.getElementById('kasur').value) || 0,
        toilet: parseFloat(document.getElementById('toilet').value) || 0,
        lantai: parseFloat(document.getElementById('lantai').value) || 0,
        udara: parseFloat(document.getElementById('udara').value) || 0,
        tataLetak: parseFloat(document.getElementById('tataLetak').value) || 0,
        totalScore: hitungTotal()
      };

      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(result => {
        if (result.status === "success") {
          alert("Data berhasil tersimpan ke Google Sheets!");
          loadDataFromCloud(); // Otomatis refresh tabel
        } else {
          alert("Gagal menyimpan: " + result.message);
        }
      })
      .catch(err => {
        console.error("Save Error:", err);
        alert("Terjadi kesalahan saat mengirim data ke cloud.");
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Simpan ke Cloud`;
      });
    }

    // Jalankan saat halaman dibuka
    window.addEventListener('DOMContentLoaded', () => {
      loadDataFromCloud();
    });
  </script>
</body>
</html>
